[build-system]
requires      = ["maturin>=1,<2"]
build-backend = "maturin"

[project]
name        = "ferogram"
version     = "0.5.5b2"
description = "A modern, elegant, asynchronous MTProto framework for building Telegram clients and bots in Python."
readme      = "README.md"
license     = { text = "MIT OR Apache-2.0" }
authors     = [{ name = "Ankit Chaubey", email = "ankitchaubey.dev@gmail.com" }]
keywords    = ["telegram", "mtproto", "rust", "client", "bot", "ferogram"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Rust",
    "Topic :: Communications :: Chat",
    "Topic :: Software Development :: Libraries",
]
requires-python = ">=3.9"

[project.urls]
Homepage      = "https://ferogram.dev"
Source        = "https://github.com/ankit-chaubey/ferogram-py"
Documentation = "https://python.ferogram.dev"
Tracker       = "https://github.com/ankit-chaubey/ferogram-py/issues"
Author        = "https://github.com/ankit-chaubey"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.maturin]
python-source = "python"
module-name   = "ferogram._ferogram"
features      = ["pyo3/extension-module"]
include       = [
    "python/ferogram/raw/generated/**/*",
    { path = "schema/**/*", format = "sdist" },
    { path = "tools/**/*", format = "sdist" },
]

[tool.pytest.ini_options]
testpaths  = ["tests"]
pythonpath = ["python"]

[tool.ruff]
target-version = "py39"
extend-exclude = ["python/ferogram/raw/generated"]

[tool.ruff.lint]
# Real-bug rules only (pyflakes + syntax errors). Style rules are not enforced.
select = ["F", "E9"]
