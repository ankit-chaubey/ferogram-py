[package]
name        = "ferogram-py"
version     = "0.5.3"
edition     = "2024"
description = "Python MTProto client based on ferogram (Rust MTProto)"
build       = "build.rs"
license     = "MIT OR Apache-2.0"

[lib]
name       = "_ferogram"
crate-type = ["cdylib"]

[dependencies]
ferogram-mtsender   = { git = "https://github.com/ankit-chaubey/ferogram", rev = "bf716ce" }
ferogram-session    = { git = "https://github.com/ankit-chaubey/ferogram", rev = "bf716ce", features = ["sqlite-session"] }
ferogram-connect    = { git = "https://github.com/ankit-chaubey/ferogram", rev = "bf716ce", features = ["socks5"] }
ferogram-tl-types   = { git = "https://github.com/ankit-chaubey/ferogram", rev = "bf716ce" }
ferogram-crypto     = { git = "https://github.com/ankit-chaubey/ferogram", rev = "bf716ce" }
ferogram-msgbox     = { git = "https://github.com/ankit-chaubey/ferogram", rev = "bf716ce" }
getrandom           = "0.4"
base64              = "0.23"
pyo3                = { version = "0.29", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio               = { version = "1.53", features = ["full"] }
pyo3-log            = "0.13"
log                 = "0.4"

[profile.release]
strip     = true
opt-level = 3
lto       = true

[build-dependencies]
pyo3-build-config = "0.29"
