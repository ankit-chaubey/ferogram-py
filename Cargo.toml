[package]
name        = "ferogram-py"
version     = "0.5.1"
edition     = "2024"
description = "Python MTProto client based on ferogram (Rust MTProto)"
build       = "build.rs"
license     = "MIT OR Apache-2.0"

[lib]
name       = "_ferogram"
crate-type = ["cdylib"]

[dependencies]
# Pointed at the local checkout for now so the PipelinedSender/spawn_pipelined
# additions are visible before ferogram-mtsender 0.6.4+ is published to
# crates.io. Assumes a sibling checkout layout: ../ferogram-py/ (this repo)
# and ../ferogram/ (the ferogram-main repo). Switch back to version-only once
# published.
ferogram-mtsender   = { path = "../ferogram/ferogram-mtsender", version = "0.6.3" }
ferogram-session    = { path = "../ferogram/ferogram-session", version = "0.6.3", features = ["sqlite-session", "libsql-session"] }
ferogram-connect    = { path = "../ferogram/ferogram-connect", version = "0.6.3" }
ferogram-tl-types   = { path = "../ferogram/ferogram-tl-types", version = "0.6.3" }
ferogram-crypto     = { path = "../ferogram/ferogram-crypto", version = "0.6.3" }
getrandom           = "0.2"
base64              = "0.22"
pyo3                = { version = "0.24", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.24", features = ["tokio-runtime"] }
tokio               = { version = "1", features = ["full"] }

[profile.release]
strip     = true
opt-level = 3
lto       = true

[build-dependencies]
pyo3-build-config = "0.24"
