[package]
name        = "ferogram-py"
version     = "0.4.0"
edition     = "2024"
description = "Python bindings for ferogram (Rust MTProto)"
license     = "MIT OR Apache-2.0"

[lib]
name       = "_ferogram"
crate-type = ["cdylib"]

[dependencies]
hex                 = "0.4"
ferogram = { git = "https://github.com/ankit-chaubey/ferogram", rev = "9a363e2a3cd8daa27c4838162be84bda81654b4b", features = ["sqlite-session", "libsql-session"] }
pyo3                = { version = "0.24", features = ["extension-module", "abi3-py313"] }
pyo3-async-runtimes = { version = "0.24", features = ["tokio-runtime"] }
tokio               = { version = "1", features = ["full"] }
# Note: do NOT add ferogram-tl-types as a direct dep - use ferogram::tl instead
# to avoid a duplicate-crate version conflict (crates.io vs git).

[profile.release]
strip     = true
opt-level = 3
lto       = true
