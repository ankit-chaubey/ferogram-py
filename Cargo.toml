[package]
name            = "ferogram-py"
version         = "0.5.4"
edition         = "2024"
description     = "Python MTProto client based on ferogram (Rust MTProto)"
documentation   = "https://python.ferogram.dev"
homepage        = "https://ferogram.dev"
repository      = "https://github.com/ankit-chaubey/ferogram-py"
readme          = "README.md"
build           = "build.rs"
license         = "MIT OR Apache-2.0"

[lib]
name            = "_ferogram"
crate-type      = ["cdylib"]

[dependencies]
ferogram-mtsender   = { version = "0.6.5" }
ferogram-session    = { version = "0.6.5", features = ["sqlite-session"] }
ferogram-connect    = { version = "0.6.5", features = ["socks5"] }
ferogram-tl-types   = { version = "0.6.5" }
ferogram-crypto     = { version = "0.6.5" }
ferogram-msgbox     = { version = "0.6.5" }
getrandom           = "0.4"
base64              = "0.23"
pyo3                = { version = "0.29", features = ["extension-module", "abi3-py39"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio               = { version = "1.53", features = ["full"] }
pyo3-log            = "0.13"
log                 = "0.4"

[profile.release]
strip     = true
opt-level = 3
lto       = true

[build-dependencies]
pyo3-build-config = "0.29"
