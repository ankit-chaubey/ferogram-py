[package]
name            = "ferogram-py"
version         = "0.5.5-beta.7"
edition         = "2024"
description     = "Elegant, modern and asynchronous Telegram MTProto API framework in Python for users and bots, powered by Rust."
documentation   = "https://python.ferogram.dev"
homepage        = "https://ferogram.dev"
repository      = "https://github.com/ankit-chaubey/ferogram-py"
readme          = "README.md"
build           = "build.rs"
license         = "MIT OR Apache-2.0"

[lib]
name            = "_ferogram"
crate-type      = ["cdylib"]

[dependencies]
ferogram-mtsender   = { git = "https://github.com/ankit-chaubey/ferogram", rev = "4d4b69a" }
ferogram-session    = { git = "https://github.com/ankit-chaubey/ferogram", rev = "4d4b69a", features = ["sqlite-session"] }
ferogram-connect    = { git = "https://github.com/ankit-chaubey/ferogram", rev = "4d4b69a", features = ["socks5"] }
ferogram-tl-types   = { git = "https://github.com/ankit-chaubey/ferogram", rev = "4d4b69a" }
ferogram-crypto     = { git = "https://github.com/ankit-chaubey/ferogram", rev = "4d4b69a" }
ferogram-msgbox     = { git = "https://github.com/ankit-chaubey/ferogram", rev = "4d4b69a" }
getrandom           = "0.4"
base64              = "0.23"
pyo3                = { version = "0.29", features = ["extension-module", "abi3-py310"] }
pyo3-async-runtimes = { version = "0.29", features = ["tokio-runtime"] }
tokio               = { version = "1.53", features = ["full"] }
pyo3-log            = "0.13"
log                 = "0.4"

[profile.release]
strip     = true
opt-level = 3
lto       = "fat"
codegen-units = 1
debug     = false

[build-dependencies]
pyo3-build-config = "0.29"
