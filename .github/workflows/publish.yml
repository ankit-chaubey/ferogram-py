name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
          - android-termux
          - sdist
      publish:
        description: "Upload to PyPI after build. Only runs from a v* tag with job=all."
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:

  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Tag matches pyproject.toml version
        id: version
        run: python .github/scripts/check_release.py version
      - name: Version is not on PyPI yet
        if: github.ref_type == 'tag' && (github.event_name == 'push' || (inputs.publish == true && inputs.job == 'all'))
        run: python .github/scripts/check_release.py version --check-pypi

  tests:
    needs: check
    if: github.event_name == 'push' || inputs.job == 'all'
    uses: ./.github/workflows/tests.yml

  linux:
    needs: check
    if: github.event_name == 'push' || inputs.job == 'all' || inputs.job == 'linux'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        # ring's build.rs compiles ARM assembly via cc-rs using the manylinux
        # cross-compiler, which doesn't define __ARM_ARCH. Explicitly set it.
        env:
          CFLAGS_aarch64_unknown_linux_gnu: "-D__ARM_ARCH=8 -march=armv8-a"
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  macos:
    needs: check
    if: github.event_name == 'push' || inputs.job == 'all' || inputs.job == 'macos'
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  windows:
    needs: check
    if: github.event_name == 'push' || inputs.job == 'all' || inputs.job == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          args: --release --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-windows
          path: dist
          if-no-files-found: error

  # Builds for Termux (the terminal app), not for embedding inside a
  # general Android APK. This links against Termux's own Python package
  # and Termux's runtime library layout - a wheel from this job is only
  # installable via `pip install` inside Termux. It will not work with
  # app-embedded interpreters like Chaquopy or python-for-android; those
  # bundle their own CPython and need a separate build target entirely.
  android-termux:
    needs: check
    if: github.event_name == 'push' || inputs.job == 'all' || inputs.job == 'android-termux'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-linux-android
            api: 24
            arch: arm64-v8a
          - target: armv7-linux-androideabi
            api: 24
            arch: armeabi-v7a
          - target: x86_64-linux-android
            api: 24
            arch: x86_64
          - target: i686-linux-android
            api: 24
            arch: x86
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Setup Android NDK r26d (cross-compiler for the Termux target)
        uses: nttld/setup-ndk@ed92fe6cadad69be94a966a7ee3271275e62f779 # v1.6.0
        id: ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.target }}

      - name: Add Rust Android target
        run: rustup target add ${{ matrix.target }}

      - name: Install maturin
        run: pip install maturin

      - name: Fetch Termux libpython for linking
        run: |
          TARGET=${{ matrix.target }}
          case "$TARGET" in
            aarch64-linux-android)   TERMUX_ARCH=aarch64 ;;
            armv7-linux-androideabi) TERMUX_ARCH=arm     ;;
            x86_64-linux-android)    TERMUX_ARCH=x86_64  ;;
            i686-linux-android)      TERMUX_ARCH=i686    ;;
          esac

          # Locate the python package in Termux's apt repo
          PKGS_URL="https://packages.termux.dev/apt/termux-main/dists/stable/main/binary-${TERMUX_ARCH}/Packages"
          DEB_PATH=$(curl -sL "$PKGS_URL" | \
            awk '/^Package: python$/{f=1} f && /^Filename:/{print $2; f=0}' | head -1)
          echo "Downloading: $DEB_PATH"

          mkdir -p /tmp/termux-py && cd /tmp/termux-py
          curl -sL "https://packages.termux.dev/apt/termux-main/${DEB_PATH}" -o python.deb
          ar x python.deb
          # data archive may be .tar.xz or .tar.zst depending on Termux version
          # Don't pin the minor version here - Termux's "python" package always
          # tracks upstream latest, and older debs fall out of the Packages
          # index once superseded, so a hardcoded "libpython3.13" wildcard
          # breaks the moment Termux bumps its default Python.
          tar xf data.tar.* --wildcards "*/libpython3.*" 2>/dev/null || true

          LIB_DIR=/tmp/termux-py/data/data/com.termux/files/usr/lib
          SO_FILE=$(ls "$LIB_DIR"/libpython3.*.so* 2>/dev/null | head -1)
          if [ -z "$SO_FILE" ]; then
            echo "::error::No libpython3.*.so found in Termux's python package ($DEB_PATH)"
            exit 1
          fi

          # Extract "3.14" out of ".../libpython3.14.so"
          PYVER=$(basename "$SO_FILE" | sed -E 's/^libpython(3\.[0-9]+)\.so.*/\1/')
          UNVERSIONED="$LIB_DIR/libpython${PYVER}.so"
          if [ ! -f "$UNVERSIONED" ]; then
            ln -sf "$(basename "$SO_FILE")" "$UNVERSIONED"
          fi

          echo "TERMUX_LIBDIR=$LIB_DIR" >> $GITHUB_ENV
          echo "TERMUX_PYVER=$PYVER" >> $GITHUB_ENV
          echo "Linking against Termux libpython $PYVER ($SO_FILE)"

      - name: Build Termux wheel
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_API_LEVEL: ${{ matrix.api }}
          PYO3_CROSS_PYTHON_VERSION: ${{ env.TERMUX_PYVER }}
        run: |
          NDK_BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          TARGET=${{ matrix.target }}
          API=${{ matrix.api }}

          # Resolve the correct clang triple for this target + API level
          case "$TARGET" in
            aarch64-linux-android)   CLANG_PREFIX="aarch64-linux-android${API}" ;;
            armv7-linux-androideabi) CLANG_PREFIX="armv7a-linux-androideabi${API}" ;;
            x86_64-linux-android)    CLANG_PREFIX="x86_64-linux-android${API}" ;;
            i686-linux-android)      CLANG_PREFIX="i686-linux-android${API}" ;;
          esac

          # cc-rs reads CC_<target> with lowercase triple (dashes -> underscores).
          # CARGO_TARGET_<TARGET>_LINKER uses uppercase. Split accordingly.
          TARGET_UPPER=$(echo "$TARGET" | tr '[:lower:]-' '[:upper:]_')
          TARGET_LOWER=$(echo "$TARGET" | tr '-' '_')
          export CC_${TARGET_LOWER}=$NDK_BIN/${CLANG_PREFIX}-clang
          export CXX_${TARGET_LOWER}=$NDK_BIN/${CLANG_PREFIX}-clang++
          export AR_${TARGET_LOWER}=$NDK_BIN/llvm-ar
          export CARGO_TARGET_${TARGET_UPPER}_LINKER=$NDK_BIN/${CLANG_PREFIX}-clang

          # Link against Termux's real libpython<version>.so, and embed the
          # rpath Termux's own binaries carry (/data/data/com.termux/files/usr/lib)
          # so the loader actually searches that directory at dlopen time.
          # Without this, DT_NEEDED entries resolve to nothing even when the
          # target file exists right there, since bionic doesn't search
          # $PREFIX/lib by default the way it does system paths.
          export RUSTFLAGS="-L native=$TERMUX_LIBDIR -C link-arg=-Wl,-rpath=/data/data/com.termux/files/usr/lib"

          maturin build \
            --release \
            --target $TARGET \
            --compatibility off \
            --out dist

      - name: Rewrite libpython dependency to be version-agnostic
        run: |
          which patchelf >/dev/null 2>&1 || (sudo apt-get update && sudo apt-get install -y patchelf)
          for whl in dist/*.whl; do
            whl_abs=$(readlink -f "$whl")
            workdir=$(mktemp -d)
            unzip -q "$whl_abs" -d "$workdir"
            so_file=$(find "$workdir" -name "_ferogram*.so" | head -1)
            if [ -z "$so_file" ]; then
              echo "::error::No _ferogram*.so found inside $whl"
              exit 1
            fi
            patchelf --replace-needed "libpython${TERMUX_PYVER}.so" "libpython3.so" "$so_file"
            echo "Patched $so_file: DT_NEEDED libpython${TERMUX_PYVER}.so -> libpython3.so"

            rm -f "$whl_abs"
            (cd "$workdir" && zip -qr "$whl_abs" .)
            rm -rf "$workdir"
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-android-termux-${{ matrix.target }}
          path: dist
          if-no-files-found: error

  sdist:
    needs: check
    if: github.event_name == 'push' || inputs.job == 'all' || inputs.job == 'sdist'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: PyO3/maturin-action@e83996d129638aa358a18fbd1dfb82f0b0fb5d3b # v1.51.0
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wheels-sdist
          path: dist
          if-no-files-found: error

  smoke:
    name: Smoke test (Python ${{ matrix.python }})
    needs: [check, linux]
    if: github.event_name == 'push' || inputs.job == 'all' || inputs.job == 'linux'
    # ubuntu-latest has no Python 3.9 build for actions/setup-python, see tests.yml
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: wheels-linux-x86_64-unknown-linux-gnu
          path: dist
      - name: Install the wheel and import it
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install dist/*.whl
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/venv/bin/python" - <<'EOF'
          import os
          from importlib.metadata import version

          import ferogram
          from ferogram import _ferogram
          from ferogram.raw.generated._tl_schema import LAYER

          installed = version("ferogram")
          assert installed == os.environ["VERSION"], (installed, os.environ["VERSION"])
          print("imported ferogram", installed, "on TL layer", LAYER)
          EOF

  collect:
    needs: [check, tests, smoke, linux, macos, windows, android-termux, sdist]
    if: github.event_name == 'push' || inputs.job == 'all'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: "wheels-*"
          merge-multiple: true
          path: dist
      - name: Release holds exactly the expected distributions
        run: python .github/scripts/check_release.py dists dist "${{ needs.check.outputs.version }}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist
          if-no-files-found: error

  # The only job with id-token: write. It downloads the checked files and runs
  # the PyPA action, nothing else. Maturin builds, it does not upload.
  publish:
    needs: [check, collect]
    if: github.ref_type == 'tag' && (github.event_name == 'push' || (inputs.publish == true && inputs.job == 'all'))
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/ferogram/${{ needs.check.outputs.version }}/
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Upload to PyPI with PEP 740 attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist
          attestations: true
          skip-existing: false
      # The action writes <file>.publish.attestation next to each distribution
      # before it uploads. If attestations were silently turned off, none exist.
      - name: Every distribution has an attestation
        run: |
          shopt -s nullglob
          dists=(dist/*.whl dist/*.tar.gz)
          echo "${#dists[@]} distributions"
          [ "${#dists[@]}" -gt 0 ]
          missing=0
          for d in "${dists[@]}"; do
            if [ ! -f "$d.publish.attestation" ]; then
              echo "::error::no attestation was generated for $d"
              missing=1
            fi
          done
          exit "$missing"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: attestations
          path: dist/*.publish.attestation
          if-no-files-found: error

  verify:
    needs: [check, publish]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: dist
          path: dist
      - name: Files and provenance on PyPI match what was uploaded
        run: |
          python .github/scripts/verify_provenance.py ferogram "${{ needs.check.outputs.version }}" \
            --dist-dir dist \
            --repository "$GITHUB_REPOSITORY" \
            --workflow publish.yml \
            --environment pypi \
            --files-out "$RUNNER_TEMP/files.txt"
      - name: Verify the attestation signatures
        run: |
          python -m pip install pypi-attestations==0.0.31
          while read -r f; do
            pypi-attestations verify pypi --repository "https://github.com/$GITHUB_REPOSITORY" "pypi:$f"
          done < "$RUNNER_TEMP/files.txt"
