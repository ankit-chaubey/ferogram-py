name: Publish to PyPI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      job:
        description: "Which job to run"
        required: true
        default: all
        type: choice
        options:
          - all
          - linux
          - macos
          - windows
          - android
          - sdist
      publish:
        description: "Upload to PyPI after build"
        required: false
        default: false
        type: boolean

jobs:

  linux:
    if: github.event_name == 'push' || inputs.job == 'all' || inputs.job == 'linux'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
          manylinux: auto
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.target }}
          path: dist

  macos:
    if: github.event_name == 'push' || inputs.job == 'all' || inputs.job == 'macos'
    runs-on: macos-latest
    strategy:
      matrix:
        target:
          - x86_64-apple-darwin
          - aarch64-apple-darwin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.target }}
          path: dist

  windows:
    if: github.event_name == 'push' || inputs.job == 'all' || inputs.job == 'windows'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-windows
          path: dist

  android:
    if: github.event_name == 'push' || inputs.job == 'all' || inputs.job == 'android'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Setup Android NDK r26d
        uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r26d
          link-to-sdk: true

      - name: Add Rust Android targets
        run: |
          rustup target add aarch64-linux-android
          rustup target add x86_64-linux-android

      - name: Install maturin
        run: pip install maturin

      - name: Build aarch64-linux-android wheel
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          NDK_BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC_aarch64_linux_android=$NDK_BIN/aarch64-linux-android24-clang
          export CXX_aarch64_linux_android=$NDK_BIN/aarch64-linux-android24-clang++
          export AR_aarch64_linux_android=$NDK_BIN/llvm-ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$NDK_BIN/aarch64-linux-android24-clang
          maturin build --release \
            --target aarch64-linux-android \
            --interpreter python3.12 \
            --out dist

      - name: Build x86_64-linux-android wheel
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          NDK_BIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          export CC_x86_64_linux_android=$NDK_BIN/x86_64-linux-android24-clang
          export CXX_x86_64_linux_android=$NDK_BIN/x86_64-linux-android24-clang++
          export AR_x86_64_linux_android=$NDK_BIN/llvm-ar
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER=$NDK_BIN/x86_64-linux-android24-clang
          maturin build --release \
            --target x86_64-linux-android \
            --interpreter python3.12 \
            --out dist

      - uses: actions/upload-artifact@v4
        with:
          name: wheels-android
          path: dist

  sdist:
    if: github.event_name == 'push' || inputs.job == 'all' || inputs.job == 'sdist'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wheels-sdist
          path: dist

  publish:
    needs: [linux, macos, windows, android, sdist]
    if: |
      always() &&
      (github.event_name == 'push' || inputs.publish == true) &&
      !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "wheels-*"
          merge-multiple: true
          path: dist
      - uses: PyO3/maturin-action@v1
        with:
          command: upload
          args: --non-interactive --skip-existing dist/*
