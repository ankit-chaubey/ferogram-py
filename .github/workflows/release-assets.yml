name: Release assets

# Attaches the wheels and sdist of a version that is already on PyPI to its
# GitHub release. Nothing is rebuilt and nothing is uploaded to PyPI.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag, for example v0.5.5"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-assets-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  assets:
    runs-on: ubuntu-24.04
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
          persist-credentials: false

      - name: Download the files from PyPI
        run: |
          version="${TAG#v}"
          mkdir dist
          python3 - "$version" <<'PY'
          import hashlib
          import json
          import sys
          import urllib.request

          version = sys.argv[1]
          url = f"https://pypi.org/pypi/ferogram/{version}/json"
          with urllib.request.urlopen(url) as r:
              files = json.load(r)["urls"]
          if not files:
              sys.exit(f"::error::ferogram {version} has no files on PyPI")
          for f in files:
              data = urllib.request.urlopen(f["url"]).read()
              if hashlib.sha256(data).hexdigest() != f["digests"]["sha256"]:
                  sys.exit(f"::error::checksum mismatch for {f['filename']}")
              with open(f"dist/{f['filename']}", "wb") as out:
                  out.write(data)
              print(f["filename"])
          PY
          ls -l dist

      - name: Attach to the GitHub release
        run: |
          version="${TAG#v}"
          python3 .github/scripts/release_notes.py "$version" > notes.md
          flags=""
          if [[ "$version" =~ (a|b|rc)[0-9]+$ ]]; then
            flags="--prerelease"
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber
          else
            gh release create "$TAG" dist/* --title "$TAG" --notes-file notes.md --verify-tag $flags
          fi
